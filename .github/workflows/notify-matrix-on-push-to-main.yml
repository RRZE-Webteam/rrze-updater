name: Notify Matrix on push to main

on:
  push:
    branches:
      - main # Trigger only when there is a push to the main branch

jobs:
  notify_matrix_on_push:
    runs-on: ubuntu-latest
    steps:
      - name: Send Matrix notification
        env:
          MATRIX_ACCESS_TOKEN: ${{ secrets.MATRIX_ACCESS_TOKEN }}
          MATRIX_ROOM_ID: ${{ secrets.MATRIX_REPORT_ROOM_ID }} # room ID
        run: |
          transaction_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          message="A new push was made to the main branch in ${GITHUB_REPOSITORY} by ${GITHUB_ACTOR}."
          payload="$(jq -nc --arg body "$message" '{msgtype: "m.text", body: $body}')"

          curl --fail-with-body --silent --show-error --request PUT \
            "https://matrix.fau.de/_matrix/client/v3/rooms/${MATRIX_ROOM_ID}/send/m.room.message/${transaction_id}" \
            --header "Authorization: Bearer ${MATRIX_ACCESS_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "$payload"
